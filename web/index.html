<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Sqanny</title>
    <meta
      name="description"
      content="Sqanny Stands: QR codes you can repoint without reprinting."
    />
    <!--
      Script is `type="module"` and `defer` is implied by that. Nothing here may
      block paint: the shell renders its skeleton immediately (see AppShell) so a
      cold load never shows a blank document.

      The stylesheet is imported from main.tsx, NOT linked here, so Vite can
      fingerprint it and Tailwind's injected layer cannot flash unstyled.
    -->
  </head>
  <body>
    <div id="root">
      <!--
        Pre-hydration skeleton. Deliberately the SHAPE of the app shell (a bar
        and a content column) rather than a spinner: requirement 27 forbids
        generic spinners for content loading, and this is what the user sees for
        the ~100ms between document parse and React mount.
      -->
      <div
        aria-busy="true"
        aria-label="Loading Sqanny"
        style="min-height:100dvh;background:#141414"
      >
        <div style="max-width:1440px;margin:0 auto;padding:0 24px">
          <div
            style="height:57px;border-bottom:1px solid #302d2a;display:flex;align-items:center;gap:12px"
          >
            <div
              style="width:22px;height:22px;border-radius:6px;background:#232120"
            ></div>
            <div style="width:96px;height:11px;border-radius:999px;background:#232120"></div>
            <div style="flex:1"></div>
            <div style="width:120px;height:26px;border-radius:999px;background:#232120"></div>
            <div style="width:26px;height:26px;border-radius:999px;background:#232120"></div>
          </div>
          <div style="display:grid;gap:14px;padding-top:36px">
            <div style="width:280px;height:26px;border-radius:8px;background:#1b1a19"></div>
            <div style="width:520px;height:13px;border-radius:6px;background:#1b1a19"></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:34px">
            <div style="height:104px;border-radius:12px;background:#1b1a19"></div>
            <div style="height:104px;border-radius:12px;background:#1b1a19"></div>
            <div style="height:104px;border-radius:12px;background:#1b1a19"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
